<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4a90d9"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="8" fill="#0d1117"/>

  <!-- G29 Wheel box -->
  <rect x="20" y="60" width="120" height="50" rx="6" fill="#1a2332" stroke="#3a4a5c" stroke-width="1.5"/>
  <text x="80" y="82" text-anchor="middle" fill="#e6edf3" font-weight="600">G29 Wheel</text>
  <text x="80" y="98" text-anchor="middle" fill="#8b949e" font-size="11">+ Pedals</text>

  <!-- Auth Board box -->
  <rect x="20" y="180" width="120" height="50" rx="6" fill="#1a2332" stroke="#3a4a5c" stroke-width="1.5"/>
  <text x="80" y="202" text-anchor="middle" fill="#e6edf3" font-weight="600">Auth Board</text>
  <text x="80" y="218" text-anchor="middle" fill="#8b949e" font-size="11">PowerA</text>

  <!-- RP2040 #2 box -->
  <rect x="220" y="40" width="200" height="210" rx="8" fill="#1a2332" stroke="#58a6ff" stroke-width="2"/>
  <text x="320" y="66" text-anchor="middle" fill="#58a6ff" font-weight="700" font-size="14">RP2040 #2</text>
  <text x="320" y="84" text-anchor="middle" fill="#8b949e" font-size="12">G29 Board</text>
  <line x1="240" y1="94" x2="400" y2="94" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="116" text-anchor="middle" fill="#e6edf3" font-size="12">PIO0 Host</text>
  <text x="320" y="134" text-anchor="middle" fill="#8b949e" font-size="11">G29 HID Parsing</text>
  <text x="320" y="158" text-anchor="middle" fill="#e6edf3" font-size="12">PIO1 Host</text>
  <text x="320" y="176" text-anchor="middle" fill="#8b949e" font-size="11">Auth Relay</text>
  <text x="320" y="200" text-anchor="middle" fill="#e6edf3" font-size="12">FFB Output</text>
  <text x="320" y="218" text-anchor="middle" fill="#8b949e" font-size="11">G29 Force Feedback</text>
  <text x="320" y="242" text-anchor="middle" fill="#8b949e" font-size="11">SPI Slave</text>

  <!-- SPI Link -->
  <rect x="468" y="100" width="100" height="70" rx="6" fill="#1c2536" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="518" y="124" text-anchor="middle" fill="#f0883e" font-weight="600" font-size="12">SPI Link</text>
  <text x="518" y="142" text-anchor="middle" fill="#8b949e" font-size="11">10 MHz</text>
  <text x="518" y="158" text-anchor="middle" fill="#8b949e" font-size="11">32B + CRC-8</text>

  <!-- RP2040 #1 box -->
  <rect x="616" y="40" width="200" height="210" rx="8" fill="#1a2332" stroke="#58a6ff" stroke-width="2"/>
  <text x="716" y="66" text-anchor="middle" fill="#58a6ff" font-weight="700" font-size="14">RP2040 #1</text>
  <text x="716" y="84" text-anchor="middle" fill="#8b949e" font-size="12">Xbox Board</text>
  <line x1="636" y1="94" x2="796" y2="94" stroke="#30363d" stroke-width="1"/>
  <text x="716" y="116" text-anchor="middle" fill="#e6edf3" font-size="12">GIP Device</text>
  <text x="716" y="134" text-anchor="middle" fill="#8b949e" font-size="11">Xbox Protocol</text>
  <text x="716" y="158" text-anchor="middle" fill="#e6edf3" font-size="12">Equation VM</text>
  <text x="716" y="176" text-anchor="middle" fill="#8b949e" font-size="11">16-Slot FFB Bytecode</text>
  <text x="716" y="200" text-anchor="middle" fill="#e6edf3" font-size="12">FFB Engine</text>
  <text x="716" y="218" text-anchor="middle" fill="#8b949e" font-size="11">Force Translation</text>
  <text x="716" y="242" text-anchor="middle" fill="#8b949e" font-size="11">SPI Master</text>

  <!-- USB arrows: G29 -> Board 2 -->
  <line x1="140" y1="85" x2="215" y2="85" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="178" y="78" text-anchor="middle" fill="#8b949e" font-size="10">USB</text>

  <!-- USB arrows: Auth -> Board 2 -->
  <line x1="140" y1="205" x2="215" y2="175" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="168" y="182" text-anchor="middle" fill="#8b949e" font-size="10">USB</text>

  <!-- SPI arrows -->
  <line x1="420" y1="128" x2="463" y2="128" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="568" y1="142" x2="611" y2="142" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Return arrows (dashed) -->
  <line x1="463" y1="142" x2="420" y2="142" stroke="#f0883e" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="611" y1="128" x2="568" y2="128" stroke="#f0883e" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- Polling rate label -->
  <text x="518" y="190" text-anchor="middle" fill="#f0883e" font-size="10">1 kHz</text>

  <!-- Xbox Series X label -->
  <text x="855" y="125" text-anchor="middle" fill="#e6edf3" font-weight="600" font-size="13">Xbox</text>
  <text x="855" y="142" text-anchor="middle" fill="#e6edf3" font-weight="600" font-size="13">Series X</text>

  <!-- USB arrow: Board 1 -> Xbox -->
  <line x1="816" y1="135" x2="830" y2="135" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="823" y="125" text-anchor="middle" fill="#8b949e" font-size="10">USB</text>

  <!-- Bottom legend -->
  <text x="450" y="295" text-anchor="middle" fill="#484f58" font-size="11">Solid arrows = data flow direction · Dashed arrows = bidirectional SPI</text>
</svg>
